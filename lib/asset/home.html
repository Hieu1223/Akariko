<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --accent: #{{ACCENT_HEX}};
    --bg: #ffffff;
    --surface: #f5f5f5;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --divider: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e8e8e8;
      --text-secondary: #999999;
      --divider: #333333;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 32px 20px 60px; }
  .logo {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; margin-bottom: 12px;
  }
  .logo-icon svg { width: 30px; height: 30px; fill: white; }
  .logo h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .section-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-secondary);
    margin-bottom: 12px;
  }
  .quick-access {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 12px; margin-bottom: 36px;
  }
  .quick-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 6px; border-radius: 12px; cursor: pointer;
    transition: background 0.15s; text-decoration: none; color: var(--text);
  }
  .quick-item:active { background: var(--surface); }
  .quick-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface); display: flex; align-items: center;
    justify-content: center; margin-bottom: 6px;
  }
  .quick-icon svg { width: 18px; height: 18px; fill: var(--text-secondary); }
  .quick-label {
    font-size: 11px; max-width: 64px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; text-align: center;
  }
  .news-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .news-header .section-title { margin-bottom: 0; }
  .manage-link {
    font-size: 12px; color: var(--accent); cursor: pointer;
    text-decoration: none; padding: 4px 8px; border-radius: 6px;
  }
  .manage-link:active { background: var(--surface); }
  .article {
    padding: 14px 0; border-bottom: 1px solid var(--divider);
    cursor: pointer; transition: opacity 0.15s;
  }
  .article:active { opacity: 0.7; }
  .article:last-child { border-bottom: none; }
  .article-title {
    font-size: 15px; font-weight: 600; line-height: 1.4;
    margin-bottom: 4px; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .article.read .article-title { font-weight: 400; }
  .article-summary {
    font-size: 13px; color: var(--text-secondary); line-height: 1.4;
    margin-bottom: 6px; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .article-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-secondary);
  }
  .article-source { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .article-time { flex-shrink: 0; }
  .empty {
    text-align: center; padding: 32px 0; color: var(--text-secondary);
    font-size: 14px;
  }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--divider);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
    </div>
    <h1>Yomu</h1>
  </div>

  <div id="bookmarks-section">
    <div class="section-title">Quick access</div>
    <div class="quick-access" id="bookmarks-list"></div>
  </div>

  <div class="news-header">
    <div class="section-title">News</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="spinner" id="refresh-spinner"></div>
      <span class="manage-link" id="manage-link">Manage sources</span>
    </div>
  </div>
  <div id="news-list"></div>
</div>

<script>
(function() {
  var data = {{FEED_DATA}};

  function openUrl(url) {
    window.flutter_inappwebview.callHandler('yomuOpenUrl', url);
  }

  function renderBookmarks() {
    var list = document.getElementById('bookmarks-list');
    var section = document.getElementById('bookmarks-section');
    if (!data.bookmarks || data.bookmarks.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = '';
    var html = '';
    data.bookmarks.forEach(function(b) {
      html += '<div class="quick-item" data-url="' + escapeAttr(b.url) + '">' +
        '<div class="quick-icon">' +
          '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>' +
        '</div>' +
        '<span class="quick-label">' + escapeHtml(b.displayTitle) + '</span>' +
      '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.quick-item').forEach(function(el) {
      el.addEventListener('click', function() { openUrl(el.dataset.url); });
    });
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var now = new Date();
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (d.toDateString() === now.toDateString()) {
      return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  function renderNews() {
    var list = document.getElementById('news-list');
    if (!data.articles || data.articles.length === 0) {
      list.innerHTML = '<div class="empty">No articles yet</div>';
      return;
    }
    var html = '';
    data.articles.forEach(function(a) {
      var cls = a.isRead ? 'article read' : 'article';
      html += '<div class="' + cls + '" data-link="' + escapeAttr(a.link) + '">' +
        '<div class="article-title">' + escapeHtml(a.title) + '</div>' +
        (a.summary ? '<div class="article-summary">' + escapeHtml(a.summary) + '</div>' : '') +
        '<div class="article-meta">' +
          '<span class="article-source">' + escapeHtml(a.sourceName) + '</span>' +
          (a.publishedAt ? '<span class="article-time">' + formatTime(a.publishedAt) + '</span>' : '') +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.article').forEach(function(el) {
      el.addEventListener('click', function() { openUrl(el.dataset.link); });
    });
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function escapeAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('manage-link').addEventListener('click', function() {
    window.flutter_inappwebview.callHandler('yomuManageSources', '');
  });

  renderBookmarks();
  renderNews();
})();
</script>
</body>
</html>
