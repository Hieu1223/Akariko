name: arisu_browser
description: "Yomu — an on-device Japanese-reading browser built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.6.0

  # Routing (declarative shell routes)
  go_router: ^14.8.0

  # Runtime permission management (browser network/storage access)
  permission_handler: ^11.3.0

  # WebView / browser engine (JS injection, screenshots, custom context menu)
  flutter_inappwebview: ^6.1.1

  # HTTP (search-suggestion autocomplete); one keep-alive client is reused.
  http: ^1.6.0

  # RSS/Atom feed parsing (news feed phase, §7.17).
  webfeed_revised: ^0.9.0

  # Date/time formatting for the news feed timestamps (also used by the later
  # localization phase, §12).
  intl: ^0.20.0

  # Relational storage
  drift: ^2.24.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5

  # KV storage (settings, prefs)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.24.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    # Prebuilt, compressed in-memory dictionary trie (word, kana, meaning) built
    # by `tool/build_dictionary.dart`. Decoded once at startup into an in-memory
    # prefix trie — no SQLite table, no on-device JSON parse.
    - lib/asset/dictionary.dat
    # In-app home page (new-tab) template. Loaded once at startup, then
    # feed data (bookmarks + news) is injected per navigation via loadData().
    - lib/asset/home.html
