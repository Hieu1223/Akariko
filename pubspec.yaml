name: arisu_browser
description: "Yomu — an on-device Japanese-reading browser built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.6.0

  # Routing (declarative shell routes)
  go_router: ^14.8.0

  # Runtime permission management (browser network/storage access)
  permission_handler: ^11.3.0

  # WebView / browser engine (JS injection, screenshots, custom context menu)
  flutter_inappwebview: ^6.1.1

  # Relational storage
  drift: ^2.24.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5

  # KV storage (settings, prefs)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.24.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    # Bundled dictionary dataset, imported into DictionaryEntriesTable on first
    # use (phase 3). ~50 MB / ~190k entries, parsed off the UI isolate.
    - lib/asset/dictionary.json
